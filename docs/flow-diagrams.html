<g transform="translate(10,665)">

  <text x="10" y="16" font-size="9" font-weight="600" fill="#9ca3af">KEY: Why two instructions?</text>
  <text x="10" y="30" font-size="8" fill="#374151">Solana's Ed25519 signature verification is implemented as a native program that runs before the main program. The result is stored in the</text>
  <text x="10" y="41" font-size="8" fill="#374151">Sysvar::Instructions account. The verify_ika_collateral instruction (ix[1]) does NOT re-verify the signature itself — it reads the precompile's</text>
  <text x="10" y="52" font-size="8" fill="#374151">result from the sysvar. This is both cheaper (no in-program Ed25519 math) and more secure (Ed25519 native is audited Solana code).</text>
  <text x="10" y="66" font-size="9" font-weight="600" fill="#9ca3af">Why threshold MPC (not a multisig)?</text>
  <text x="10" y="78" font-size="8" fill="#374151">A multisig still requires a private key to exist somewhere. Threshold MPC (via IKA's dWallet) means no single party ever holds the full</text>
  <text x="10" y="88" font-size="8" fill="#374151">private key — the key is split across IKA nodes. A borrower default cannot be reversed by any single party, including the protocol admin.</text>
</g>
